<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corazón de Pulpa · Consola</title>
<style>
:root{
  --bg:#1A1410; --bg2:#231a14; --panel:#2E231B; --line:#4a3a2c;
  --gold:#C9A24D; --gold2:#E8C877; --cream:#F5EFE3; --muted:#B8AC98;
  --verde:#6B8E23; --roja:#E63946;
  --clima:#3D9BE9; --cultura:#FF9F1C; --vrio:#9B6BFF; --criterio:#E8B04A;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%, #2c2018 0%, var(--bg) 65%)}
button{font-family:inherit;color:inherit;cursor:pointer}
body.idle, body.idle *{cursor:none !important}

#video{position:fixed;inset:0;width:100%;height:100%;background:#000;object-fit:contain;z-index:1}
#video[hidden]{display:none}
#view{position:fixed;inset:0;z-index:2}
body.playing #view{pointer-events:none}

/* ---------- HUD ---------- */
#hud{position:fixed;top:2.2vh;right:1.8vw;z-index:5;width:clamp(240px,22vw,420px);
  background:rgba(26,20,16,.88);border:1px solid var(--line);border-radius:14px;padding:1.4vh 1.2vw;
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .3s}
body.playing:not(.hud-on) #hud, body.nohud #hud, body.start #hud{opacity:0;pointer-events:none}
.h-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.3vh .6vw;margin:.7vh 0}
.h-lbl{font-size:clamp(11px,.85vw,16px);font-weight:600;letter-spacing:.02em;color:var(--muted)}
.h-val{font-size:clamp(14px,1.15vw,22px);font-weight:700;font-variant-numeric:tabular-nums;position:relative}
.h-track{grid-column:1/3;height:clamp(6px,.6vh,10px);background:#3a2e24;border-radius:99px;overflow:hidden}
.h-fill{height:100%;border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.delta{position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);font-size:.8em;font-weight:800;
  padding:.1em .45em;border-radius:6px;opacity:0;transition:opacity .3s;white-space:nowrap}
.delta.show{opacity:1}
.delta.up{background:#2f5d2a;color:#d6f5cd}.delta.down{background:#6b1f24;color:#ffd5d8}

/* ---------- Barra de control ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:.8vw;padding:1.2vh 1.6vw;
  background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0));transform:translateY(100%);transition:transform .25s}
#bar.show, body.start #bar{transform:none}
#bar .where{flex:1;min-width:0;font-size:clamp(12px,.9vw,16px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .where b{color:var(--cream)}
#bar button{background:rgba(46,35,27,.95);border:1px solid var(--line);border-radius:10px;padding:.8vh 1vw;font-size:clamp(12px,.9vw,16px);font-weight:600}
#bar button:hover{border-color:var(--gold)}

/* ---------- Pantallas comunes ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6vh 6vw}
.kicker{font-size:clamp(13px,1.15vw,22px);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.serif{font-family:var(--serif);font-style:italic;font-weight:700}
.hint{font-size:clamp(12px,1vw,18px);color:var(--muted)}
.hint kbd, .keys kbd{display:inline-block;min-width:1.8em;padding:.1em .45em;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;background:var(--panel);color:var(--cream);font-family:var(--sans);font-size:.9em;font-weight:700}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.6vh 2vw;font-size:clamp(14px,1.2vw,22px);font-weight:700}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:linear-gradient(160deg,var(--gold2),var(--gold));color:#2a1d10;border:none}
.fadein{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Inicio ---------- */
.title-main{font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(48px,9vw,180px);line-height:1;
  background:linear-gradient(180deg,#F7DE9A,#C9A24D 60%,#9c7a2f);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 20px rgba(201,162,77,.25))}
.title-sub{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.6vw,48px);margin-top:1.5vh}
.fruits{font-size:clamp(28px,3.6vw,64px);letter-spacing:.3em;margin:3vh 0 1vh}
.start-actions{display:flex;flex-wrap:wrap;gap:1.2vw;justify-content:center;margin-top:4vh}
.toggle{display:flex;align-items:center;gap:.6vw;margin-top:3vh;font-size:clamp(13px,1vw,18px);color:var(--muted);cursor:pointer}
.toggle input{width:1.3em;height:1.3em;accent-color:var(--gold)}
.credit{position:absolute;bottom:calc(5.5vh + 34px);left:0;right:0;font-size:clamp(11px,.85vw,15px);color:#8c806e}

/* ---------- Votación ---------- */
.vote{position:absolute;inset:0;display:grid;grid-template-rows:auto auto 1fr auto;gap:2.4vh;padding:5vh 5vw 6vh}
.vote .head{max-width:calc(100vw - 13vw - clamp(240px,22vw,420px));text-align:left}
.vote .question{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(26px,3.9vw,76px);line-height:1.12;margin-top:1vh}
.vote .question.long{font-size:clamp(22px,2.9vw,56px)}
.vote .note{font-size:clamp(12px,1.05vw,19px);color:var(--muted);text-align:left}
.options{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4vw;min-height:0}
.opt{position:relative;border:none;border-radius:28px;padding:4vh 3vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;
  text-align:center;color:#fff;transition:transform .35s, opacity .35s, filter .35s, box-shadow .35s;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.opt.verde{background:linear-gradient(160deg,#86b133,#5b7a1b 70%,#4a6315)}
.opt.roja{background:linear-gradient(160deg,#f2545f,#c92a36 70%,#a51e29)}
.opt .icon{font-size:clamp(36px,7vh,110px);line-height:1}
.opt .lbl{font-weight:800;font-size:clamp(28px,4.6vw,96px);letter-spacing:.04em;line-height:1}
.opt .desc{font-size:clamp(14px,1.55vw,30px);max-width:28ch;line-height:1.3;font-weight:500}
.opt .key{position:absolute;top:2vh;left:1.4vw;font-size:clamp(11px,.9vw,16px);font-weight:700;border:2px solid rgba(255,255,255,.6);border-radius:8px;padding:.2em .6em}
.opt.chosen{transform:scale(1.035);box-shadow:0 0 0 6px var(--gold2), 0 20px 50px rgba(0,0,0,.5)}
.opt.dim{opacity:.22;filter:grayscale(.7)}
.timer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(90px,13vh,170px);height:clamp(90px,13vh,170px);
  border-radius:50%;background:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 8px var(--bg)}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer .t{font-size:clamp(28px,4.6vh,62px);font-weight:800;font-variant-numeric:tabular-nums}
.timer.out{animation:pulse .8s infinite}
.timer.out .t{font-size:clamp(14px,2vh,26px);color:var(--gold2);letter-spacing:.08em}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--bg),0 0 0 16px rgba(232,200,119,.35)}}
.vote .foot{text-align:center}
.resolve{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:4vh 6vw 5vh;text-align:center;
  background:linear-gradient(to top, rgba(26,20,16,.98) 70%, rgba(26,20,16,0));animation:rise .45s ease both}
@keyframes rise{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.resolve .big{font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(28px,4vw,76px)}
.resolve .small{font-size:clamp(14px,1.5vw,28px);color:var(--cream);margin-top:1vh}

/* ---------- Barras grandes ---------- */
.bigtitle{font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(34px,5vw,100px);line-height:1.05}
.bigsub{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.4vw,46px);color:var(--gold2);margin-top:1vh}
.bigbars{width:min(78vw,1400px);margin-top:5vh;display:flex;flex-direction:column;gap:3vh}
.bb{display:grid;grid-template-columns:clamp(150px,17vw,320px) 1fr clamp(70px,6vw,120px) clamp(70px,6vw,120px);align-items:center;gap:1.4vw}
.bb-l{text-align:left;font-weight:700;font-size:clamp(15px,1.6vw,30px)}
.bb-track{position:relative;height:clamp(20px,3.6vh,48px);background:#3a2e24;border-radius:99px;overflow:hidden}
.bb-fill{height:100%;border-radius:99px;transition:width 1.8s cubic-bezier(.2,.8,.2,1)}
.bb-mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--cream);opacity:.85}
.bb-v{font-size:clamp(22px,2.6vw,52px);font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.bb-d{font-size:clamp(15px,1.5vw,28px);font-weight:800;text-align:left;opacity:0;transition:opacity .5s}
.bb-d.show{opacity:1}.bb-d.up{color:#9be08a}.bb-d.down{color:#ff8a92}.bb-d.zero{color:var(--muted)}
.avg{margin-top:4vh;font-size:clamp(18px,1.8vw,34px);color:var(--muted)}
.avg b{font-size:clamp(40px,5vw,96px);color:var(--cream);font-variant-numeric:tabular-nums;margin:0 .3em;vertical-align:middle}
.verdict{margin-top:2vh;font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(34px,5.4vw,110px);opacity:0;transform:scale(.9);transition:all .8s}
.verdict.show{opacity:1;transform:none}
.verdict.a{color:var(--gold2);text-shadow:0 0 40px rgba(255,159,28,.5)}
.verdict.b{color:#9fb3c8}

/* ---------- Respuesta ---------- */
.mark{font-size:clamp(60px,13vh,180px);line-height:1;font-weight:800}
.mark.ok{color:#9be08a}.mark.no{color:#ff8a92}
.answer-lbl{display:inline-block;margin-top:2vh;padding:.3em .9em;border-radius:16px;font-weight:800;font-size:clamp(28px,4.4vw,90px);color:#fff}
.answer-lbl.verde{background:var(--verde)}.answer-lbl.roja{background:var(--roja)}
.explain{font-size:clamp(18px,2.1vw,40px);max-width:40ch;margin-top:3vh;line-height:1.3}
.effect{margin-top:2.4vh;font-size:clamp(15px,1.5vw,28px);font-weight:700;color:var(--gold2)}

/* ---------- Grito ---------- */
.call{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(30px,4.6vw,92px);margin-top:1.4vh}
.resp{font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(40px,7vw,150px);color:var(--gold2);margin-top:1.4vh;opacity:0;transform:scale(.85);transition:all .7s}
.resp.show{opacity:1;transform:none}
.who{font-size:clamp(15px,1.5vw,28px);color:var(--muted);margin-top:4vh}

/* ---------- Video ausente / ensayo ---------- */
.ph{max-width:min(80vw,1300px);border:2px dashed var(--gold);border-radius:24px;padding:5vh 4vw;background:rgba(46,35,27,.6)}
.ph .file{font-family:Consolas, "Courier New", monospace;font-size:clamp(14px,1.3vw,24px);color:var(--gold2);margin-top:2vh}
.ph .rows{font-size:clamp(13px,1.1vw,20px);color:var(--muted);margin-top:1vh}
.ph .sum{font-size:clamp(16px,1.7vw,32px);margin-top:3vh;line-height:1.35}
.tap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);z-index:4}

/* ---------- Superposiciones (menú, ayuda, videos) ---------- */
.overlay{position:fixed;inset:0;z-index:10;background:rgba(10,8,6,.92);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:5vh 4vw}
.overlay[hidden]{display:none}
.card{width:min(1100px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:3.5vh 2.6vw}
.card h2{font-family:var(--serif);font-style:italic;font-size:clamp(24px,2.4vw,42px);margin-bottom:1.5vh}
.card h3{font-size:clamp(13px,1vw,18px);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:2.4vh 0 1vh}
.card p{color:var(--muted);font-size:clamp(13px,1vw,18px);line-height:1.5}
.card .close{float:right}
.steps{display:flex;flex-direction:column;gap:4px}
.steps button{text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:.6vh .8vw;font-size:clamp(13px,1vw,17px);color:var(--cream)}
.steps button:hover{border-color:var(--line);background:var(--panel)}
.steps button.cur{border-color:var(--gold);background:var(--panel)}
.steps .t{color:var(--muted);font-size:.85em;margin-left:.6em}
.adjust{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw}
.adjust label{display:flex;flex-direction:column;gap:.5vh;font-size:clamp(12px,.9vw,16px);color:var(--muted)}
.adjust input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.8vh .6vw;font-size:clamp(16px,1.3vw,24px);color:var(--cream);font-family:inherit;font-weight:700;width:100%}
.row-actions{display:flex;flex-wrap:wrap;gap:.8vw;margin-top:1.6vh}
table{width:100%;border-collapse:collapse;font-size:clamp(12px,.95vw,17px)}
th,td{text-align:left;padding:.8vh .6vw;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--gold);font-weight:700;letter-spacing:.04em}
td.mono{font-family:Consolas, "Courier New", monospace;color:var(--gold2);white-space:nowrap}
.ok{color:#9be08a;font-weight:700}.miss{color:#ff8a92;font-weight:700}.wait{color:var(--muted)}
.keys td:first-child{white-space:nowrap}

/* ---------- Resumen final ---------- */
.end{position:absolute;inset:0;overflow:auto;padding:6vh 6vw;display:flex;flex-direction:column;align-items:center}
.end table{max-width:1300px;margin-top:3vh;font-size:clamp(14px,1.15vw,22px)}
.end td,.end th{padding:1.2vh .8vw}
.chip{display:inline-block;padding:.1em .6em;border-radius:8px;font-weight:800;color:#fff;font-size:.9em}
.chip.duplicar,.chip.si{background:var(--verde)}.chip.adaptar,.chip.no{background:var(--roja)}

/* =========================== v2 =========================== */
/* Entrada dramática de cada pantalla */
.scr-in{animation:scrIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes scrIn{0%{opacity:0;transform:scale(1.12);filter:blur(10px) brightness(1.8)}60%{filter:blur(0) brightness(1.1)}100%{opacity:1;transform:none;filter:none}}

/* Inicio vivo */
.floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaters span{position:absolute;bottom:-12vh;font-size:clamp(28px,4vw,72px);opacity:.16;animation:floatUp linear infinite;filter:blur(.5px)}
@keyframes floatUp{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-130vh) rotate(360deg)}}
body.start .screen{z-index:1}
.title-main.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 6px 34px rgba(232,200,119,.55)) brightness(1.12)}}
.fruits span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.fruits span:nth-child(2){animation-delay:.3s}.fruits span:nth-child(3){animation-delay:.6s}.fruits span:nth-child(4){animation-delay:.9s}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.status{display:flex;flex-wrap:wrap;gap:.8vw;justify-content:center;margin-top:2.4vh}
.pill{display:flex;align-items:center;gap:.5em;background:rgba(46,35,27,.8);border:1px solid var(--line);border-radius:99px;padding:.5vh 1vw;font-size:clamp(12px,.9vw,16px);color:var(--muted)}
.pill b{color:var(--cream)}.pill.good{border-color:#5d8a3a}.pill.bad{border-color:#a3323b}
.pill button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.2em .7em;font-size:.95em;font-weight:700}
.pill button:hover{border-color:var(--gold)}
.mini{width:70px;height:8px;background:#3a2e24;border-radius:99px;overflow:hidden}
.mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,#86b133,#E8C877,#f2545f);transition:width .08s}

/* Votación con tensión */
.vote.shake{animation:shake .35s linear infinite}
@keyframes shake{25%{transform:translate(4px,-3px)}50%{transform:translate(-4px,2px)}75%{transform:translate(3px,3px)}}
.timer.hot .t{color:#ff8a92}
.timer.hot{animation:hot .5s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 0 0 8px var(--bg),0 0 0 22px rgba(230,57,70,.4)}}

/* Aplausómetro */
.opt .meter{position:absolute;left:6%;right:6%;bottom:2.2vh;height:clamp(14px,2.4vh,30px);background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;opacity:0;transition:opacity .3s}
.opt .meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#fff7d6,#E8C877,#fff);box-shadow:0 0 18px #fff6;transition:width .07s linear}
.opt.measuring .meter,.opt.scored .meter{opacity:1}
.opt.measuring{transform:scale(1.04);box-shadow:0 0 0 6px #fff, 0 0 60px rgba(255,255,255,.35)}
.opt.waiting{opacity:.4}
.opt .score{position:absolute;top:1.6vh;right:1.6vw;font-size:clamp(22px,3vw,58px);font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 3px 12px rgba(0,0,0,.4)}
.apl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;text-align:center;pointer-events:none;
  background:rgba(26,20,16,.94);border:2px solid var(--gold);border-radius:26px;padding:2.2vh 2.4vw;min-width:min(44vw,720px);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.apl .a1{font-size:clamp(14px,1.3vw,24px);font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.apl .a2{font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(30px,4.4vw,88px);line-height:1.1;margin-top:1vh}
.apl .a3{font-size:clamp(40px,6.5vw,124px);font-weight:900;line-height:1;margin-top:1vh;color:var(--gold2);font-variant-numeric:tabular-nums}
.apl .a4{font-size:clamp(13px,1.1vw,20px);color:var(--muted);margin-top:1.4vh}
.apl.go .a3{animation:boom .5s ease infinite alternate}
@keyframes boom{to{transform:scale(1.12);color:#fff}}

/* Reacción del personaje */
.react{position:absolute;left:4vw;bottom:24vh;z-index:5;display:flex;align-items:center;gap:1.4vw;animation:slideIn .6s cubic-bezier(.2,1.3,.4,1) both;pointer-events:none}
.react img{width:clamp(110px,13vw,240px);height:clamp(110px,13vw,240px);border-radius:50%;object-fit:cover;object-position:50% 22%;border:5px solid var(--gold2);box-shadow:0 14px 40px rgba(0,0,0,.6);background:#000}
.react .bub{position:relative;background:var(--cream);color:#2a1d10;border-radius:22px;padding:1.6vh 1.6vw;max-width:34vw;font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(18px,2vw,40px);line-height:1.2;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.react .bub:before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);border:12px solid transparent;border-right-color:var(--cream);border-left:0}
.react .who{display:block;font-family:var(--sans);font-style:normal;font-size:.5em;letter-spacing:.14em;text-transform:uppercase;color:#8a5a1c;margin-bottom:.4vh}
@keyframes slideIn{from{transform:translateX(-60%) scale(.7);opacity:0}}
.screen .react{bottom:6vh}

/* Indicadores que caen o suben */
.bb.fall .bb-track{animation:fall 1s ease 3}
@keyframes fall{50%{box-shadow:0 0 0 3px #e63946,0 0 30px #e6394699}}
.bb.rise .bb-track{animation:rise2 1s ease 2}
@keyframes rise2{50%{box-shadow:0 0 0 3px #9be08a,0 0 30px #9be08a99}}

/* Confeti y grieta */
.conf{position:fixed;top:-8vh;z-index:8;pointer-events:none;font-size:clamp(22px,2.6vw,48px);animation:confFall linear forwards}
@keyframes confFall{to{transform:translateY(118vh) rotate(720deg)}}
.crack{position:fixed;inset:0;z-index:8;pointer-events:none}
.crack path{fill:none;stroke:#e8eef5;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 6px #fff);stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1.1s ease forwards}

<script>
"use strict";
/* =========================================================
   Corazón de Pulpa · Consola de la función
   Funciona sin internet. Los videos van en la carpeta videos/
   ========================================================= */

const $ = s => document.querySelector(s);
const view = $('#view'), video = $('#video'), hud = $('#hud');
const KEY_SAVE = 'cdp-consola-v3', KEY_SET = 'cdp-consola-ajustes-v3';

const IND = [
  {key:'clima',   label:'Clima laboral'},
  {key:'cultura', label:'Cultura / Alma'},
  {key:'vrio',    label:'Ventaja VRIO'},
];
const INIT = {clima:82, cultura:85, vrio:70, criterio:0, choices:{}, final:null, verOtro:false, bonus:0, aplausos:{}, manual:{}};
const CRIT_MAX = 20;
const UMBRAL = 55;
const D3 = {adaptar:{clima:8, cultura:7, vrio:6}, duplicar:{clima:-4, cultura:-4, vrio:-3}};

const clone = o => JSON.parse(JSON.stringify(o));
const clamp = n => Math.max(0, Math.min(100, Math.round(n)));
const val = (x, s) => typeof x === 'function' ? x(s) : x;
const fmt = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avg = s => Math.round((s.clima + s.cultura + s.vrio) / 3 * 10) / 10;

/* ---------- Opciones ---------- */
const OPT_DA = (dup, adapt) => [
  {key:'duplicar', label:'DUPLICAR', icon:'🥑', desc:dup,   cls:'verde'},
  {key:'adaptar',  label:'ADAPTAR',  icon:'🍓', desc:adapt, cls:'roja'}];
const OPT_SN = [
  {key:'si', label:'SÍ', icon:'✓', desc:'Tarjeta verde', cls:'verde'},
  {key:'no', label:'NO', icon:'✗', desc:'Tarjeta roja',  cls:'roja'}];

/* =========================================================
   GUION DE LA FUNCIÓN
   ========================================================= */
const STEPS = [];
let CUR = '', first = false;
function sec(name){ CUR = name; first = true; }
function add(s){ s.chapter = CUR; if(first){ s.first = true; first = false; } STEPS.push(s); return s; }
function vid(file, title, rows, summary, extra){ return add(Object.assign({type:'video', file, title, rows, summary}, extra || {})); }
function ind(title, target){ return add({type:'indicators', title, target}); }

/* Decisión del Acto 1: el salón opina, Don Harold hace lo que quiere */
function act1(id, n, cap, q, dup, adapt, rowsDup, rowsAdapt){
  add({type:'vote', id, label:`Decisión ${n}`, kicker:`Decisión ${n}`, question:q, timer:45, act:1, aplauso:true, options:OPT_DA(dup, adapt),
    apply(s, k){ if(k === 'adaptar') s.criterio += 10; },
    resolve(s, k){ return k === 'adaptar'
      ? {big:'El salón eligió ADAPTAR', small:'Criterio del salón +10. Pero en el Acto 1 el que decide es Don Harold…'}
      : {big:'El salón eligió DUPLICAR', small:'Criterio del salón +0. Veamos qué hace Don Harold…'}; }});
  vid(s => `${cap}-${s.choices[id]}.mp4`, `Reacción a la decisión ${n}`,
      s => s.choices[id] === 'duplicar' ? rowsDup : rowsAdapt,
      'La reacción de Don Harold según lo que votó el salón.',
      {variants:[{file:`${cap}-duplicar.mp4`, rows:rowsDup}, {file:`${cap}-adaptar.mp4`, rows:rowsAdapt}]});
}

/* Pregunta con respuesta correcta (prueba VRIO) */
function quiz(o){
  add({type:'vote', id:o.id, label:o.label, kicker:o.kicker, question:o.q, timer:o.timer, options:o.options, note:o.note,
    apply(s, k){ if(k === o.correct) o.ok(s); },
    resolve(s, k){ const op = o.options.find(x => x.key === k); return {big:`El salón respondió: ${op.label}`, small:o.wait}; }});
  vid(o.file, o.videoTitle, o.rows, o.videoSum);
  add({type:'answer', id:o.id, label:o.label + ' · respuesta', correct:o.correct, options:o.options, explain:o.explain, effect:o.effect});
}

/* Decisión 3: ahora sí se ejecuta */
function d3(id, n, title, q, dup, adapt, cap, rowsDup, rowsAdapt){
  add({type:'vote', id, label:`Decisión 3${n}`, kicker:`Decisión 3 · ${title} · ${'ab'.indexOf(n) + 1} de 2`, question:q, timer:30, act:2, aplauso:true, options:OPT_DA(dup, adapt),
    apply(s, k){ const d = D3[k]; for(const x in d) s[x] = clamp(s[x] + d[x]); },
    resolve(s, k){ const d = D3[k];
      return {big:`El salón decidió ${k === 'adaptar' ? 'ADAPTAR' : 'DUPLICAR'}`,
              small:`Clima ${fmt(d.clima)} · Cultura ${fmt(d.cultura)} · VRIO ${fmt(d.vrio)} · Esta vez, se ejecuta.`}; }});
  vid(s => `${cap}-${s.choices[id]}.mp4`, `Resultado de la decisión 3${n}`,
      s => s.choices[id] === 'duplicar' ? rowsDup : rowsAdapt,
      'Lo que pasa en FrutiTech con la decisión del salón.',
      {variants:[{file:`${cap}-duplicar.mp4`, rows:rowsDup}, {file:`${cap}-adaptar.mp4`, rows:rowsAdapt}]});
}

/* ----- Intro y prólogo ----- */
sec('Intro');
add({type:'luces', label:'Apaguen las luces'});
vid('intro.mp4', 'Intro · "Corazón de Pulpa"', 'Póster + C1 a C4 + Don Lulo', 'Presentan los integrantes del equipo y el profesor. Cada personaje aparece con su letrero de telenovela.');
sec('Prólogo');
vid('prologo.mp4', 'Prólogo · "Lo tenía todo"', 'P1 a P3', 'La gala copiada y sin alma. Daniel con un sobre. Don Harold brinda solo. "Tres meses antes…"');
add({type:'grito', label:'Ensayo del grito', who:'Cuando Don Harold diga:', call:'¡Así lo hace Frugle!', resp:'¡Pero nosotros no somos Frugle!'});

/* ----- Capítulo 1 ----- */
sec('Capítulo 1 · El atajo');
vid('cap01.mp4', 'Capítulo 1 · El atajo', '1.1, J1 a J4, 1.7, 1.8', 'Don Harold vuelve del congreso con el 3x2 de Frugle "cambiándole el logo". Valentina pide diagnóstico, Daniel pregunta por la planta. El dedo sobre ENTER.');
act1('d1', 1, 'cap01', '¿Qué debe hacer Don Harold con la política 3x2?',
  'Enviarla hoy, tal cual llegó.', 'Frenar y hacer primero un diagnóstico.',
  '1D', '1A');
ind('Fin del capítulo 1', {clima:76, cultura:78, vrio:60});

/* ----- Capítulo 2 ----- */
sec('Capítulo 2 · Pura cáscara');
vid('cap02.mp4', 'Capítulo 2 · Pura cáscara', '2.1 a 2.10 + G3', 'Vigilancia cada cinco minutos. Viernes flexible solo para la torre. Don Lulo: "nadie vino a preguntarnos". La gala reemplaza la novena. Daniel renuncia y una mano de piña lo detiene.');
ind('Fin del Acto 1', {clima:45, cultura:50, vrio:42});
sec('Comercial');
vid('comercial.mp4', 'Comercial · Isomorfina Forte', 'CM1 a CM3', '"¿Su empresa sufre de incertidumbre? ¡Copie al líder!" Efectos secundarios: empresas pura cáscara.');

/* ----- Capítulo 3 ----- */
sec('Capítulo 3 · La Piña ha hablado');
vid('cap03.mp4', 'Capítulo 3 · La Piña ha hablado', '3.1 a 3.4', 'La Piña detiene la gala. Isomorfismo mimético y VRIO. "Ustedes, la junta. Ayúdenme a probarlo."');
const VRIO = [
  {l:'r', q:'El 3x2 de Frugle, ¿es RARO?', correct:'no', explain:'Lo tiene medio mundo. Valioso pero común: eso es empate, no ventaja.', rows:'3R', file:'cap03-r.mp4', sum:'Don Harold defiende su 3x2 y la Piña le responde.'},
  {l:'i', q:'La novena con los buñuelos de Don Lulo, ¿es DIFÍCIL DE IMITAR?', correct:'si', explain:'Veinte años de historia no se descargan de internet. Eso es pulpa.', rows:'3I', file:'cap03-i.mp4', sum:'Don Lulo le ofrece buñuelos a la Piña.'},
];
VRIO.forEach((c, i) => quiz({
  id:`d2-${c.l}`, label:`Decisión 2 · ${c.l.toUpperCase()}`, kicker:`Decisión 2 · Prueba VRIO · ${i + 1} de 2`,
  q:c.q, timer:15, options:OPT_SN, correct:c.correct,
  note:'En esta prueba: tarjeta verde = SÍ · tarjeta roja = NO',
  ok:s => { s.vrio = clamp(s.vrio + 3); s.criterio += 5; },
  wait:'Responde la Piña…', file:c.file, videoTitle:`VRIO · ${c.l.toUpperCase()}: responde la Piña`, rows:c.rows,
  videoSum:c.sum, explain:c.explain, effect:'Ventaja VRIO +3 · Criterio del salón +5'
}));
vid('cap03-fin.mp4', 'Capítulo 3 · el mando es de ustedes', '3F', '"Desde ahora, las decisiones las toman ustedes." Don Harold traga saliva.');
add({type:'bonus', label:'Capital de confianza'});
add({type:'grito', label:'Grito nuevo', who:'Cuando alguien pregunte:', call:'¿Y cómo lo hacemos aquí?', resp:'¡Con pulpa!'});

/* ----- Capítulo 4 ----- */
sec('Capítulo 4 · Diagnóstico con alma');
vid('cap04.mp4', 'Capítulo 4 · Diagnóstico con alma', '4.1 a 4.4', 'Torre y planta en la misma mesa. "El que no había madurado era yo." "El trabajo híbrido no se importa. Se diseña con la gente."');
d3('d3a', 'a', 'Para la planta', '¿Qué recibe la planta?',
  'Copiar el viernes flexible de la torre.', 'Diseñar los turnos con Don Lulo y su equipo.',
  'cap04-planta', '4AD', '4AA');
d3('d3b', 'b', 'Para diciembre', '¿Qué fiesta se hace en diciembre?',
  'La gala FrutiVerso, importada de Frugle.', 'La novena con buñuelos, renovada con la gente.',
  'cap04-diciembre', '4BD', '4BA');
vid('cap04-fin.mp4', 'Capítulo 4 · La puerta del 21 de diciembre', '4F', 'Don Harold camina hacia la puerta de la planta. "A ver qué decidieron."');

/* ----- Final ----- */
sec('Final');
add({type:'reveal', label:'Indicadores finales'});
vid(s => s.final === 'a' ? 'final-con-pulpa.mp4' : 'final-pura-cascara.mp4',
  s => s.final === 'a' ? 'Final A · Con pulpa' : 'Final B · Pura cáscara',
  s => s.final === 'a' ? 'FA1 a FA5' : 'FB1 a FB5',
  s => s.final === 'a' ? 'La novena con buñuelos. Daniel rompe la renuncia. Brindis con todos. "Benchmarking sí. Pero con pulpa."'
                       : 'La gala vacía. Daniel no volvió, Don Lulo se va. "FrutiTech sobrevivió… idéntica a todas las demás."',
  {variants:[{file:'final-con-pulpa.mp4', rows:'FA1 a FA5'}, {file:'final-pura-cascara.mp4', rows:'FB1 a FB5'}]});
add({type:'vote', id:'otro', label:'¿Ver el otro final?', kicker:'Solo si salió "Pura cáscara"', question:'¿Quieren ver qué habría pasado si hubieran adaptado?', timer:0, aplauso:true,
  when:s => s.final === 'b',
  options:[{key:'si', label:'SÍ', icon:'🍓', desc:'30 segundos del final "Con pulpa"', cls:'verde'},
           {key:'no', label:'NO', icon:'🎬', desc:'Ir directo a los créditos', cls:'roja'}],
  apply(s, k){ s.verOtro = (k === 'si'); }});
vid('final-extracto.mp4', 'Así habría sido "Con pulpa"', 'FA1 + FA4', 'El primer buñuelo de Don Lulo y el brindis con todos.',
  {when:s => s.final === 'b' && s.verOtro});
sec('Créditos');
vid('creditos.mp4', 'Créditos', 'CR2 + créditos + CR1', 'La despedida, el equipo, las referencias APA, la declaración de uso de IA y el blooper.');
add({type:'end', label:'Resumen de la función'});

/* =========================================================
   MOTOR
   ========================================================= */
let TOKEN = 0, runStart = null;
let state = clone(INIT), idx = -1, history = [], handler = null, timeouts = [], intervals = [];
let settings = {ensayo:false, mute:false, hud:false, aplauso:true};
let hudShown = null;

function later(fn, ms){ timeouts.push(setTimeout(fn, ms)); }
function every(fn, ms){ intervals.push(setInterval(fn, ms)); }
function cleanup(){
  timeouts.forEach(clearTimeout); intervals.forEach(clearInterval); timeouts = []; intervals = [];
  video.onended = video.onerror = video.ontimeupdate = null; video.pause(); video.removeAttribute('src'); video.load(); video.hidden = true;
  document.body.classList.remove('playing', 'nohud', 'start', 'gris', 'notl');
  document.querySelectorAll('.conf,.crack').forEach(e => e.remove());
  TOKEN++; handler = null; view.innerHTML = '';
}
function save(){
  try{ localStorage.setItem(KEY_SAVE, JSON.stringify({i:idx, s:history.length ? history[history.length - 1].s : state})); }catch(e){}
}
function saveSettings(){ try{ localStorage.setItem(KEY_SET, JSON.stringify(settings)); }catch(e){} }
function loadJSON(k){ try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }

function go(i){
  cleanup(); idx = i; history.push({i, s:clone(state)}); save();
  const st = STEPS[i]; (RENDER[st.type])(st);
  if(st.type !== 'video' || settings.ensayo){
    const el = view.firstElementChild;
    if(el){ el.classList.remove('fadein'); el.classList.add('scr-in'); }
    if(st.type !== 'end') whoosh();
  }
  updateHUD(); updateWhere();
}
function next(){
  let i = idx + 1;
  while(i < STEPS.length && STEPS[i].when && !STEPS[i].when(state)) i++;
  if(i < STEPS.length) go(i);
}
function back(){
  if(history.length < 2){ history = []; state = clone(INIT); showStart(); return; }
  history.pop(); const p = history.pop(); state = p.s; go(p.i);
}
function stepLabel(st, s){
  if(st.type === 'video') return val(st.title, s || state);
  if(st.type === 'indicators') return st.title;
  return st.label || st.type;
}
const CHAPTERS = [...new Set(STEPS.map(s => s.chapter))];
const SHORT = c => c.replace(/^Capítulo (\d) · .*/, 'Cap. $1').replace(/ · .*/, '');
function updateTimeline(){
  const st = STEPS[idx], cur = st ? CHAPTERS.indexOf(st.chapter) : -1;
  $('#timeline').innerHTML = CHAPTERS.map((c, i) => `<div class="seg ${i < cur ? 'done' : i === cur ? 'cur' : ''}"><span>${esc(SHORT(c))}</span><i></i></div>`).join('');
}
function nextVisible(){
  let i = idx + 1; while(i < STEPS.length && STEPS[i].when && !STEPS[i].when(state)) i++;
  return STEPS[i];
}
function noteFor(st){
  if(!st) return 'Oprima Iniciar función cuando el salón esté listo.';
  switch(st.type){
    case 'luces': return 'Pidan apagar las luces y silenciar los celulares. Espacio inicia la intro.';
    case 'video': return 'Video en curso. Espacio pausa · → salta al siguiente paso.';
    case 'vote': return st.aplauso && settings.aplauso
      ? 'Lean la pregunta en voz alta. Al acabar el tiempo (o con Espacio) arranca el aplausómetro: primero aplauden por la opción verde y luego por la roja. Si hay empate: V o R.'
      : 'Pidan levantar tarjeta verde (SÍ) o roja (NO). Cuenten y opriman V o R.';
    case 'answer': return 'Lean en voz alta la explicación de la Piña.';
    case 'indicators': return 'Comenten por qué cayeron los indicadores: Don Harold no escuchó.';
    case 'bonus': return 'Expliquen que el criterio del Acto 1 se convierte en puntos para cada indicador.';
    case 'grito': return 'Ensayen el grito con el salón dos veces, bien fuerte.';
    case 'reveal': return 'Silencio dramático: dejen que suene el redoble.';
    case 'end': return 'Agradezcan. Pueden descargar el resumen para el informe.';
  }
  return '';
}
const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function updatePresenter(){
  const pr = $('#presenter'); if(pr.hidden) return;
  const st = STEPS[idx], nx = st ? nextVisible() : STEPS[0];
  pr.innerHTML = `<span class="p-clock">${runStart ? mmss((Date.now() - runStart) / 1000) : '0:00'}</span>
    <div class="p-k" style="margin-top:0">Panel del presentador · P</div>
    <div class="p-k">Ahora</div><div class="p-v">${st ? esc(stepLabel(st)) : 'Inicio'}</div>
    <div class="p-k">Sigue</div><div class="p-v">${nx ? esc(stepLabel(nx)) : '—'}</div>
    <div class="p-k">Qué hacer</div><div class="p-v">${esc(noteFor(st))}</div>
    <div class="p-k">Indicadores</div><div class="p-v">Clima ${state.clima} · Cultura ${state.cultura} · VRIO ${state.vrio} · Criterio ${state.criterio}</div>`;
}
function togglePresenter(){ const pr = $('#presenter'); pr.hidden = !pr.hidden; updatePresenter(); }
function updateWhere(){
  updateTimeline(); updatePresenter();
  const st = STEPS[idx]; if(!st){ $('#where').innerHTML = ''; return; }
  $('#where').innerHTML = `<b>${esc(st.chapter)}</b> · ${esc(stepLabel(st))} · paso ${idx + 1} de ${STEPS.length}${settings.ensayo ? ' · <b>MODO ENSAYO</b>' : ''}`;
}

/* ---------- HUD ---------- */
function updateHUD(){
  const rows = [...IND, {key:'criterio', label:'Criterio del salón'}];
  if(!hud.children.length){
    hud.innerHTML = rows.map(r => `<div class="h-row" data-k="${r.key}"><span class="h-lbl">${r.label}</span>
      <span class="h-val"><span class="delta"></span><span class="n">0</span></span>
      <div class="h-track"><div class="h-fill" style="background:var(--${r.key})"></div></div></div>`).join('');
  }
  rows.forEach(r => {
    const el = hud.querySelector(`[data-k="${r.key}"]`), v = state[r.key];
    const pct = r.key === 'criterio' ? v / CRIT_MAX * 100 : v;
    el.querySelector('.h-fill').style.width = Math.min(100, pct) + '%';
    el.querySelector('.n').textContent = v;
    if(hudShown && hudShown[r.key] !== v){
      const d = el.querySelector('.delta'), diff = v - hudShown[r.key];
      d.textContent = fmt(diff); d.className = 'delta show ' + (diff > 0 ? 'up' : 'down');
      setTimeout(() => d.classList.remove('show'), 2600);
    }
  });
  hudShown = {clima:state.clima, cultura:state.cultura, vrio:state.vrio, criterio:state.criterio};
}

/* ---------- Sonidos (generados, sin archivos) ---------- */
let actx = null;
function tone(f, dur, vol, type){
  if(settings.mute) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.start(t); o.stop(t + dur + .05);
  }catch(e){}
}
const tick = () => tone(880, .07, .1);

function ctx(){ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function noise(dur, vol, freq, kind){
  if(settings.mute) return;
  try{
    const c = ctx(), n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
    src.buffer = b; src.connect(f); f.connect(g); g.connect(c.destination);
    if(kind === 'sweep'){ f.type = 'bandpass'; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3500, t + dur * .7); }
    else { f.type = kind || 'bandpass'; f.frequency.value = freq || 1000; }
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.start(t);
  }catch(e){}
}
const whoosh = () => noise(.55, .09, 1200, 'sweep');
const ding = () => { tone(1318, 1.4, .1, 'triangle'); setTimeout(() => tone(1760, 1.2, .08, 'triangle'), 90); };
const sad = () => [330, 311, 294, 262].forEach((f, i) => setTimeout(() => tone(f, .9, .08, 'sawtooth'), i * 420));
function drumroll(ms){
  for(let t = 0; t < ms; t += 55) later(() => noise(.07, .03 + .09 * t / ms, 180, 'lowpass'), t);
  later(() => { noise(1.6, .16, 5000, 'highpass'); tone(98, .8, .2); }, ms);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Micrófono (aplausómetro) ---------- */
const MIC = {an:null, buf:null, state:'off'};
async function micInit(){
  if(MIC.an) return true;
  try{
    const s = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    const c = ctx(); try{ await c.resume(); }catch(e){}
    const src = c.createMediaStreamSource(s), an = c.createAnalyser(); an.fftSize = 2048; src.connect(an);
    MIC.an = an; MIC.buf = new Float32Array(an.fftSize); MIC.state = 'on'; return true;
  }catch(e){ MIC.state = 'denied'; return false; }
}
function micLevel(){
  if(!MIC.an) return 0;
  MIC.an.getFloatTimeDomainData(MIC.buf);
  let s = 0; for(let i = 0; i < MIC.buf.length; i++) s += MIC.buf[i] * MIC.buf[i];
  const db = 20 * Math.log10(Math.sqrt(s / MIC.buf.length) + 1e-9);
  return Math.max(0, Math.min(100, (db + 60) / 58 * 100));   // −60 dB = 0 · −2 dB = 100 (margen para aplausos fuertes)
}

function confetti(){
  const F = ['🍓', '🥭', '🍍', '🥑', '🍊', '✨', '🎉', '🍓', '🥭'];
  for(let i = 0; i < 80; i++){
    const s = document.createElement('span'); s.className = 'conf'; s.textContent = F[i % F.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (2.6 + Math.random() * 2.8) + 's';
    s.style.animationDelay = (Math.random() * 1.6) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 7500);
  }
}
function crack(){
  const W = innerWidth, H = innerHeight, cx = W * (.35 + Math.random() * .3), cy = H * (.3 + Math.random() * .3);
  let paths = '';
  for(let k = 0; k < 9; k++){
    const ang = k / 9 * Math.PI * 2 + Math.random() * .4; let x = cx, y = cy, d = `M${x},${y}`;
    for(let j = 0; j < 7; j++){
      const r = 40 + Math.random() * 110, a = ang + (Math.random() - .5) * .9;
      x += Math.cos(a) * r; y += Math.sin(a) * r; d += ` L${x.toFixed(0)},${y.toFixed(0)}`;
    }
    paths += `<path d="${d}" style="animation-delay:${(k * .05).toFixed(2)}s"/>`;
  }
  const div = document.createElement('div'); div.className = 'crack';
  div.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 ${W} ${H}">${paths}</svg>`;
  document.body.appendChild(div);
  noise(.5, .25, 2500, 'highpass'); tone(80, .6, .25);
}

function bigBars(prev, cur, mark){
  return `<div class="bigbars">${IND.map(k => `<div class="bb" data-k="${k.key}">
    <div class="bb-l">${k.label}</div>
    <div class="bb-track"><div class="bb-fill" style="width:${prev[k.key]}%;background:var(--${k.key})"></div>${mark ? `<div class="bb-mark" style="left:${mark}%"></div>` : ''}</div>
    <div class="bb-v">${prev[k.key]}</div><div class="bb-d"></div></div>`).join('')}</div>`;
}
function animateBars(prev, cur, delay, noDelta){
  later(() => {
    IND.forEach(k => {
      const el = view.querySelector(`.bb[data-k="${k.key}"]`); if(!el) return;
      el.querySelector('.bb-fill').style.width = cur[k.key] + '%';
      countTo(el.querySelector('.bb-v'), prev[k.key], cur[k.key], 1800);
      const d = cur[k.key] - prev[k.key], dEl = el.querySelector('.bb-d');
      dEl.textContent = d === 0 ? '±0' : fmt(d);
      if(noDelta) return;
      if(d) el.classList.add(d < 0 ? 'fall' : 'rise');
      dEl.className = 'bb-d show ' + (d > 0 ? 'up' : d < 0 ? 'down' : 'zero');
    });
  }, delay || 500);
}
function countTo(el, from, to, ms){
  const t0 = performance.now();
  const stepFn = t => {
    const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if(p < 1 && el.isConnected) requestAnimationFrame(stepFn);
  };
  requestAnimationFrame(stepFn);
}

function downloadSummary(){
  const c = state.choices, lbl = {duplicar:'DUPLICAR', adaptar:'ADAPTAR', si:'SÍ', no:'NO'};
  const como = id => { const a = state.aplausos[id], m = state.manual[id];
    if(m === 'aplauso' && a) return 'Aplausómetro ' + Object.entries(a).map(([k, v]) => `${lbl[k]} ${v}`).join(' vs ');
    if(m === 'tarjetas') return 'Tarjetas'; if(m === 'manual') return 'Presentador' + (a ? ' (aplausómetro ' + Object.entries(a).map(([k, v]) => `${lbl[k]} ${v}`).join(' vs ') + ')' : '');
    return ''; };
  const rows = [['Momento', 'El salón eligió', 'Cómo se decidió', 'Efecto']];
  rows.push(['Decisión 1 · Política 3x2', lbl[c.d1] || '', como('d1'), c.d1 === 'adaptar' ? 'Criterio +10 (Don Harold envió igual)' : 'Don Harold envió igual']);
  VRIO.forEach(x => { const id = 'd2-' + x.l, k = c[id];
    rows.push([`Decisión 2 · VRIO ${x.l.toUpperCase()}`, lbl[k] || '', como(id), k ? (k === x.correct ? 'Acertó: VRIO +3 · criterio +5' : 'No acertó') : '']); });
  rows.push(['Capital de confianza', '+' + state.bonus, '', 'A cada indicador']);
  [['d3a', 'Decisión 3a · Para la planta'], ['d3b', 'Decisión 3b · Para diciembre']].forEach(([id, tt]) => { const d = c[id] ? D3[c[id]] : null;
    rows.push([tt, lbl[c[id]] || '', como(id), d ? `Clima ${fmt(d.clima)} · Cultura ${fmt(d.cultura)} · VRIO ${fmt(d.vrio)}` : '']); });
  if(c.otro) rows.push(['¿Ver el otro final?', lbl[c.otro], como('otro'), '']);
  rows.push([]);
  rows.push(['Final', state.final === 'a' ? 'Con pulpa' : state.final === 'b' ? 'Pura cáscara' : '', '', '']);
  rows.push(['Clima laboral', state.clima]); rows.push(['Cultura / Alma', state.cultura]); rows.push(['Ventaja VRIO', state.vrio]);
  rows.push(['Promedio', avg(state), `Umbral ${UMBRAL}`]); rows.push(['Criterio del salón', `${state.criterio} de ${CRIT_MAX}`]);
  if(runStart) rows.push(['Duración de la función', mmss((Date.now() - runStart) / 1000)]);
  rows.push(['Fecha', new Date().toLocaleString('es-CO')]);
  const csv = '\ufeff' + rows.map(r => r.map(x => `"${String(x == null ? '' : x).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'corazon-de-pulpa-resumen.csv'; document.body.appendChild(a); a.click(); a.remove();
}

  };
  $('#s-mic').onclick = micUI;
  if(MIC.state === 'on') micUI();
  checkVideos(tok);

  const NOTAS = [262, 330, 392, 494, 440, 392, 330, 294]; let k = 0;
  every(() => { tone(NOTAS[k % 8], 1.8, .03, 'sine'); if(k % 4 === 0) tone(NOTAS[k % 8] / 2, 2.6, .035, 'triangle'); k++; }, 650);

function checkVideos(tok){
  const files = allFiles(); let okN = 0, doneN = 0;
  files.forEach(f => {
    const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true;
    const fin = ok => { doneN++; if(ok) okN++; v.removeAttribute('src'); v.load();
      if(tok !== TOKEN || doneN < files.length) return;
      const pill = $('#st-vid'); if(!pill) return;
      pill.classList.add(okN === files.length ? 'good' : 'bad');
      pill.querySelector('b').textContent = `${okN} de ${files.length}` + (okN === files.length ? ' ✓' : ' · revisar'); };
    v.onloadedmetadata = () => fin(true); v.onerror = () => fin(false); v.src = 'videos/' + f.file;
  });
}

function allFiles(){
  const out = [], seen = new Set();
  STEPS.forEach(st => {
    if(st.type !== 'video') return;
    const list = st.variants || [{file:st.file, rows:st.rows}];
    list.forEach(v => { if(!seen.has(v.file)){ seen.add(v.file); out.push({file:v.file, rows:v.rows, chapter:st.chapter}); } });
  });
  return out;
}

/* ---------- Controles ---------- */
function toggleFS(){
  try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){}

function toggleHUD(){ settings.hud = !settings.hud; document.body.classList.toggle('hud-on', settings.hud); saveSettings(); }
function toggleMute(){ settings.mute = !settings.mute; $('#b-snd').textContent = settings.mute ? '🔇' : '🔊'; saveSettings(); }
const doCont = () => handler && handler.cont && handler.cont();
const doSkip = () => handler && (handler.skip ? handler.skip() : handler.cont && handler.cont());

$('#b-back').onclick = () => { if(idx >= 0) back(); };
$('#b-next').onclick = () => { if(handler && handler.opt){ if(handler.cont) handler.cont(); return; } doSkip(); };
$('#b-menu').onclick = () => toggle('#ov-menu', renderMenu);
$('#b-reset').onclick = askRestart;
$('#b-hud').onclick = toggleHUD;
$('#b-fs').onclick = toggleFS;
$('#b-snd').onclick = toggleMute;
$('#b-help').onclick = () => toggle('#ov-help', renderHelp);

document.addEventListener('keydown', e => {
  const k = e.key;
  if(e.target && e.target.tagName === 'INPUT') { if(k === 'Escape') closeOverlays(); return; }
  if(k === 'Escape'){ closeOverlays(); return; }
  if(k === 'm' || k === 'M'){ e.preventDefault(); toggle('#ov-menu', renderMenu); return; }
  if(k === '?'){ toggle('#ov-help', renderHelp); return; }
  if(!$('#ov-reset').hidden){ if(k === 'Enter'){ e.preventDefault(); restart(); } return; }
  if(k === 'Home'){ e.preventDefault(); askRestart(); return; }
  if(!$('#ov-menu').hidden || !$('#ov-help').hidden || !$('#ov-files').hidden) return;
  if(k === 'f' || k === 'F'){ toggleFS(); return; }
  if(k === 'h' || k === 'H'){ toggleHUD(); return; }
  if(k === 's' || k === 'S'){ toggleMute(); return; }
  if(k === 'p' || k === 'P'){ togglePresenter(); return; }
  if(!handler) return;
  if((k === 'b' || k === 'B') && handler.backup){ handler.backup(); return; }
  if(k === ' ' || k === 'Enter'){ e.preventDefault(); if(handler.opt){ if(handler.cont) handler.cont(); return; } doCont(); return; }
  if(k === 'PageDown' || k === 'ArrowRight'){ e.preventDefault(); if(handler.opt){ if(handler.cont) handler.cont(); return; } doSkip(); return; }
  if(k === 'PageUp' || k === 'ArrowLeft' || k === 'Backspace'){ e.preventDefault(); if(idx >= 0) back(); return; }
  if(handler.opt){
    if(k === 'v' || k === 'V' || k === '1'){ e.preventDefault(); handler.opt(0); return; }
    if(k === 'r' || k === 'R' || k === '2'){ e.preventDefault(); handler.opt(1); return; }
  }
});

  clearTimeout(idleT); idleT = setTimeout(() => { $('#bar').classList.remove('show'); document.body.classList.add('idle'); }, 2500);
});

/* Arranque */
(function init(){
  const s = loadJSON(KEY_SET); if(s) settings = Object.assign(settings, s);
  document.body.classList.toggle('hud-on', settings.hud);
  $('#b-snd').textContent = settings.mute ? '🔇' : '🔊';
  updateHUD(); showStart();
  const wake = () => { try{ if(actx && actx.state === 'suspended') actx.resume(); }catch(e){} };
  document.addEventListener('pointerdown', wake); document.addEventListener('keydown', wake);
  setInterval(updatePresenter, 1000);
})();
</script>
